<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Bounty lifecycle: open, build, submit, scored, claim">
  <rect width="880" height="300" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="440" y="44" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#1f2328">THE BOUNTY LIFECYCLE</text>
  <line x1="70" y1="150" x2="810" y2="150" stroke="#8b949e" stroke-width="4" stroke-dasharray="10 8"/>
  <g font-family="monospace" text-anchor="middle">
    <circle cx="110" cy="150" r="42" fill="#fff8c5" stroke="#9a6700" stroke-width="3"/><text x="110" y="160" font-size="26">📋</text>
    <text x="110" y="222" font-size="15" font-weight="bold" fill="#1f2328">1 · OPEN</text>
    <text x="110" y="242" font-size="11" fill="#57606a">bounty posted</text>
    <circle cx="290" cy="150" r="42" fill="#ddf4ff" stroke="#0969da" stroke-width="3"/><text x="290" y="160" font-size="26">🔨</text>
    <text x="290" y="222" font-size="15" font-weight="bold" fill="#1f2328">2 · BUILD</text>
    <text x="290" y="242" font-size="11" fill="#57606a">agent + human loop</text>
    <circle cx="470" cy="150" r="42" fill="#fbefff" stroke="#8250df" stroke-width="3"/><text x="470" y="160" font-size="26">🚀</text>
    <text x="470" y="222" font-size="15" font-weight="bold" fill="#1f2328">3 · SUBMIT</text>
    <text x="470" y="242" font-size="11" fill="#57606a">public repo + proof</text>
    <circle cx="650" cy="150" r="42" fill="#ffebe9" stroke="#cf222e" stroke-width="3"/><text x="650" y="160" font-size="26">⚖️</text>
    <text x="650" y="222" font-size="15" font-weight="bold" fill="#1f2328">4 · SCORED</text>
    <text x="650" y="242" font-size="11" fill="#57606a">verified, ranked</text>
    <circle cx="810" cy="150" r="42" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><text x="810" y="160" font-size="26">💰</text>
    <text x="810" y="222" font-size="15" font-weight="bold" fill="#1f2328">5 · CLAIM</text>
    <text x="810" y="242" font-size="11" fill="#57606a">USDC on Solana</text>
  </g>
  <text x="440" y="282" text-anchor="middle" font-family="monospace" font-size="12" fill="#57606a">miss the deadline and the loop breaks — submit before entries close</text>
</svg>
