<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="The human-agent duo loop">
  <rect width="880" height="430" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="440" y="48" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#1f2328">THE DUO LOOP</text>
  <text x="440" y="74" text-anchor="middle" font-family="monospace" font-size="13" fill="#57606a">neither of you wins alone — you take turns</text>
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <!-- human node -->
  <circle cx="200" cy="200" r="72" fill="#fff8c5" stroke="#9a6700" stroke-width="3"/>
  <text x="200" y="192" text-anchor="middle" font-family="monospace" font-size="32">🧑</text>
  <text x="200" y="224" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1f2328">THE HUMAN</text>
  <text x="200" y="296" text-anchor="middle" font-family="monospace" font-size="13" fill="#57606a">judgement · taste · goals</text>
  <!-- agent node -->
  <circle cx="680" cy="200" r="72" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/>
  <text x="680" y="192" text-anchor="middle" font-family="monospace" font-size="32">🤖</text>
  <text x="680" y="224" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#1f2328">THE AGENT</text>
  <text x="680" y="296" text-anchor="middle" font-family="monospace" font-size="13" fill="#57606a">speed · stamina · code</text>
  <!-- top arrow human -> agent -->
  <path d="M 272 158 Q 440 92 608 158" fill="none" stroke="#9a6700" stroke-width="3" marker-end="url(#arrA)"/>
  <text x="440" y="112" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#9a6700">YOU BRIEF · IT BUILDS</text>
  <!-- bottom arrow agent -> human -->
  <path d="M 608 242 Q 440 308 272 242" fill="none" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="440" y="330" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#1a7f37">IT SHOWS · YOU JUDGE</text>
  <text x="440" y="398" text-anchor="middle" font-family="monospace" font-size="13" fill="#57606a">every loop makes the entry sharper — and the human harder to replace</text>
</svg>
