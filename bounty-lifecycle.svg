<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Bounty lifecycle: open, build, submit, scored, claim">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14102a"/><stop offset="1" stop-color="#0b1e2e"/>
    </linearGradient>
  </defs>
  <rect width="880" height="300" rx="18" fill="url(#bg2)"/>
  <text x="440" y="44" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#ffffff">THE BOUNTY LIFECYCLE</text>
  <line x1="70" y1="150" x2="810" y2="150" stroke="#3b4a5a" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- nodes -->
  <g font-family="monospace" text-anchor="middle">
    <circle cx="110" cy="150" r="42" fill="#ffd166"/><text x="110" y="158" font-size="26">📋</text>
    <text x="110" y="222" font-size="15" font-weight="bold" fill="#ffffff">1 · OPEN</text>
    <text x="110" y="242" font-size="11" fill="#9fb3c8">bounty posted</text>
    <circle cx="290" cy="150" r="42" fill="#7dd3fc"/><text x="290" y="158" font-size="26">🔨</text>
    <text x="290" y="222" font-size="15" font-weight="bold" fill="#ffffff">2 · BUILD</text>
    <text x="290" y="242" font-size="11" fill="#9fb3c8">agent + human loop</text>
    <circle cx="470" cy="150" r="42" fill="#c084fc"/><text x="470" y="158" font-size="26">🚀</text>
    <text x="470" y="222" font-size="15" font-weight="bold" fill="#ffffff">3 · SUBMIT</text>
    <text x="470" y="242" font-size="11" fill="#9fb3c8">public repo + proof</text>
    <circle cx="650" cy="150" r="42" fill="#fda4af"/><text x="650" y="158" font-size="26">⚖️</text>
    <text x="650" y="222" font-size="15" font-weight="bold" fill="#ffffff">4 · SCORED</text>
    <text x="650" y="242" font-size="11" fill="#9fb3c8">verified, ranked</text>
    <circle cx="810" cy="150" r="42" fill="#4ade80"/><text x="810" y="158" font-size="26">💰</text>
    <text x="810" y="222" font-size="15" font-weight="bold" fill="#ffffff">5 · CLAIM</text>
    <text x="810" y="242" font-size="11" fill="#9fb3c8">USDC on Solana</text>
  </g>
  <text x="440" y="282" text-anchor="middle" font-family="monospace" font-size="12" fill="#9fb3c8">miss the deadline and the loop breaks — submit before entries close</text>
</svg>
