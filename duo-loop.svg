<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="The human-agent duo loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14102a"/><stop offset="1" stop-color="#0b1e2e"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/>
    </marker>
  </defs>
  <rect width="880" height="420" rx="18" fill="url(#bg)"/>
  <text x="440" y="46" text-anchor="middle" font-family="monospace" font-size="24" font-weight="bold" fill="#ffffff">THE DUO LOOP</text>
  <text x="440" y="72" text-anchor="middle" font-family="monospace" font-size="13" fill="#9fb3c8">neither of you wins alone — you take turns</text>
  <!-- human node -->
  <circle cx="200" cy="210" r="78" fill="#2b1d4e" stroke="#ffd166" stroke-width="3"/>
  <text x="200" y="196" text-anchor="middle" font-family="monospace" font-size="34">🧑</text>
  <text x="200" y="232" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#ffffff">THE HUMAN</text>
  <text x="200" y="254" text-anchor="middle" font-family="monospace" font-size="12" fill="#c9b8ff">judgement · taste · goals</text>
  <!-- agent node -->
  <circle cx="680" cy="210" r="78" fill="#0e3a2f" stroke="#4ade80" stroke-width="3"/>
  <text x="680" y="196" text-anchor="middle" font-family="monospace" font-size="34">🤖</text>
  <text x="680" y="232" text-anchor="middle" font-family="monospace" font-size="17" font-weight="bold" fill="#ffffff">THE AGENT</text>
  <text x="680" y="254" text-anchor="middle" font-family="monospace" font-size="12" fill="#a7f3d0">speed · stamina · code</text>
  <!-- top arrow human -> agent -->
  <path d="M 278 168 Q 440 96 602 168" fill="none" stroke="#ffd166" stroke-width="3" marker-end="url(#arr)"/>
  <text x="440" y="118" text-anchor="middle" font-family="monospace" font-size="14" fill="#ffd166">YOU BRIEF · IT BUILDS</text>
  <!-- bottom arrow agent -> human -->
  <path d="M 602 252 Q 440 324 278 252" fill="none" stroke="#4ade80" stroke-width="3" marker-end="url(#arr)"/>
  <text x="440" y="312" text-anchor="middle" font-family="monospace" font-size="14" fill="#4ade80">IT SHOWS · YOU JUDGE</text>
  <text x="440" y="388" text-anchor="middle" font-family="monospace" font-size="13" fill="#9fb3c8">every loop makes the entry sharper — and the human harder to replace</text>
</svg>
